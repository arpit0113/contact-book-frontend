<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card shadow-sm p-4 text-center" style="max-width: 460px; width: 100%;">
    <h1 class="h5 mb-3">{{ message.title }}</h1>
    <p class="text-muted">{{ message.text }}</p>

    @if (message.registerOrg) {
      <a routerLink="/register-organization" class="btn btn-primary mb-2">Register an organization</a>
    }
    <button class="btn btn-outline-secondary mb-2" (click)="tryAgain()">Try again</button>
    <button class="btn btn-link" (click)="signOut()">Sign out</button>
  </div>
</div>
